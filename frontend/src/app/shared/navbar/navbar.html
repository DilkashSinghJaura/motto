<nav class="navbar">
    <div class="nav-container">

        <div class="nav-left">
            <a routerLink="/home">
                <img src="assets/mottoLogo.svg" alt="Motto Logo">
                <span>Motto</span>
            </a>
        </div>

        <div class="nav-center" [class.mobile-open]="menuOpen">

            <ul class="nav-links">
                @for (item of navItems; track item.route) {
                <li>
                    <a [routerLink]="item.route">
                        {{ item.label }}
                    </a>
                </li>
                }
            </ul>

        </div>


        <div class="nav-right">

            <a class="profile-btn" routerLink="/profile">
                <img src="assets/profile.svg" alt="Profile">
            </a>

            <a class="menu-btn">
                <button type="button" (click)="toggleMenu()" aria-label="Menu">
                    <img src="assets/menu.svg" alt="Menu">
                </button>
            </a>


        </div>

    </div>
</nav>
